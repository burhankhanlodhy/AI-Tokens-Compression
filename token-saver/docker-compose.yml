services:
  postgres:
    # Pin the pgvector release as well as the Postgres major.  The semantic
    # cache migration requires CREATE EXTENSION vector; plain postgres:16 does
    # not ship that extension.
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: token_saver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-schema-v2.sql:/docker-entrypoint-initdb.d/10-postgres-schema.sql:ro
      # Phase C-1 is opt-in at the database-image boundary.  The base schema
      # remains stock-Postgres compatible for CI and non-semantic consumers;
      # this runs only because this service uses the pgvector image.
      - ./migrations/20260918_pc1_pgvector.sql:/docker-entrypoint-initdb.d/20-pc1-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d token_saver"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override in .env if targeting another OpenAI-compatible provider.
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://openrouter.ai/api/v1}
      # L1 lossless structural cleanup — ON by default since B-26; set
      # L1_ENABLED=false in .env to disable (see README flag note).
      L1_ENABLED: ${L1_ENABLED:-true}
      # AC-PC5: semantic cache remains off until QA clears the PC4 release
      # gate; this is deployment-only, never a client-request switch.
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      # C-2 Keys & Tenants writes: an explicit operator token is preferred;
      # blank means the proxy generates and boot-prints one once.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # P6-3 benchmark-only dose-pin gate: lets the proxy honor the
      # x-token-saver-dose-pin control header. Default FALSE — flip it on
      # ONLY for a benchmark/calibration deployment (see .env.example);
      # never in the production config.
      ALLOW_DOSE_PIN: ${ALLOW_DOSE_PIN:-false}
      # AC-P6f live-population hygiene: set ONLY on the benchmark/calibration
      # deployment — every ledger row it writes gets stamped with this tag
      # and /api/tripwire excludes tagged rows from the live population.
      # Leave unset (empty) in the production config.
      TOKEN_SAVER_MEASUREMENT_TAG: ${TOKEN_SAVER_MEASUREMENT_TAG:-}
      # Containers reach Postgres by service name; the password still comes
      # only from the ignored .env via Compose interpolation.
      TOKEN_SAVER_PG_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/token_saver
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - stats-data:/app/data          # SQLite stats survive restarts
      - hf-cache:/root/.cache/huggingface  # LLMLingua-2 model weights cache
      # AC-P6f tripwire arming: load_calibration_band() reads
      # PROXY_ROOT/benchmark/results (=/app/benchmark/results in the
      # container), which the image does NOT contain — without this mount
      # /api/tripwire reports pending_calibration forever. Read-only: the
      # harness (host side) is the ONLY writer of calibration artifacts.
      # The mount is live host disk, so a freshly committed artifact is
      # visible to the tripwire WITHOUT a container restart.
      - ./benchmark/results:/app/benchmark/results:ro
    restart: unless-stopped

volumes:
  postgres-data:
  stats-data:
  hf-cache:
