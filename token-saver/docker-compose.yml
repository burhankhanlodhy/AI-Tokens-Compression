services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: token_saver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-schema-v2.sql:/docker-entrypoint-initdb.d/10-postgres-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d token_saver"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override in .env if targeting another OpenAI-compatible provider.
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-https://openrouter.ai/api/v1}
      # L1 lossless structural cleanup — ON by default since B-26; set
      # L1_ENABLED=false in .env to disable (see README flag note).
      L1_ENABLED: ${L1_ENABLED:-true}
      # P6-3 benchmark-only dose-pin gate: lets the proxy honor the
      # x-token-saver-dose-pin control header. Default FALSE — flip it on
      # ONLY for a benchmark/calibration deployment (see .env.example);
      # never in the production config.
      ALLOW_DOSE_PIN: ${ALLOW_DOSE_PIN:-false}
      # Containers reach Postgres by service name; the password still comes
      # only from the ignored .env via Compose interpolation.
      TOKEN_SAVER_PG_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/token_saver
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - stats-data:/app/data          # SQLite stats survive restarts
      - hf-cache:/root/.cache/huggingface  # LLMLingua-2 model weights cache
    restart: unless-stopped

volumes:
  postgres-data:
  stats-data:
  hf-cache:
