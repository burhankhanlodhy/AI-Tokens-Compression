name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: token-saver/proxy/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r token-saver/proxy/requirements.txt

      - name: Run test suite
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5432
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5432/postgres
        run: |
          python -m pytest -q --ignore=test/test_pc_pgvector_gates.py --ignore=test/test_pc2_response_store_gates.py --junitxml=/tmp/pytest-standard.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/pytest-standard.xml').getroot()
          totals = {key: sum(int(s.attrib.get(key, 0)) for s in root.findall('.//testsuite'))
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          executed = totals['tests'] - totals['skipped']
          print(f"standard suite: executed={executed} passed={totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']} skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}")
          if executed < 667 or totals['skipped']:
              raise SystemExit('executed test floor violated: expected at least 667 non-skipped tests')
          PY

      - name: Run reverse-order suite
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5432
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5432/postgres
        run: |
          # --ignore is inert against explicitly-named paths, so the pgvector
          # gates must be filtered out of the list before pytest sees them:
          # they error (not skip) on the stock postgres:16 service.
          mapfile -t tests < <(printf '%s\n' test/test_*.py | sort -r | grep -vx -e "test/test_pc_pgvector_gates.py" -e "test/test_pc2_response_store_gates.py")
          python -m pytest -q --junitxml=/tmp/pytest-reverse.xml "${tests[@]}"
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/pytest-reverse.xml').getroot()
          totals = {key: sum(int(s.attrib.get(key, 0)) for s in root.findall('.//testsuite'))
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          executed = totals['tests'] - totals['skipped']
          print(f"reverse suite: executed={executed} passed={totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']} skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}")
          if executed < 667 or totals['skipped']:
              raise SystemExit('executed test floor violated: expected at least 667 non-skipped tests')
          PY

  c5-docker-acceptance:
    name: C-5 Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run clean-clone Docker acceptance gate
        run: ./token-saver/test/c5_docker_acceptance.sh

  pc1-pgvector:
    name: PC1/PC2 pinned pgvector lane
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: token-saver/proxy/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r token-saver/proxy/requirements.txt

      - name: Apply and reapply the pinned pgvector migration
        env:
          TOKEN_SAVER_PG_ADMIN_DSN: postgresql://postgres:ci-password@localhost:5434/postgres
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5434/token_saver
        run: ./token-saver/test/pc1_pgvector_acceptance.sh

      - name: Run pgvector behavior gates (PC1/PC2/PC4 corpus)
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5434
        run: |
          python -m pytest -q test/test_pc_pgvector_gates.py test/test_pc2_response_store_gates.py --junitxml=/tmp/pytest-pgvector.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/pytest-pgvector.xml').getroot()
          totals = {key: sum(int(s.attrib.get(key, 0)) for s in root.findall('.//testsuite'))
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          executed = totals['tests'] - totals['skipped']
          print(f"pgvector gates: executed={executed} passed={totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']} skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}")
          if executed < 34 or totals['skipped']:
              raise SystemExit('pgvector gate floor violated: expected at least 34 non-skipped pgvector gates')
          PY
