name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: token-saver/proxy/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r token-saver/proxy/requirements.txt

      - name: Run test suite
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5432
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5432/postgres
        run: python -m pytest -q

      - name: Run reverse-order suite
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5432
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5432/postgres
        run: |
          mapfile -t tests < <(find test -maxdepth 1 -type f -name 'test_*.py' -printf '%p\n' | sort -r)
          python -m pytest -q "${tests[@]}"
