name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: token-saver/proxy/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r token-saver/proxy/requirements.txt

      - name: Run test suite
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5432
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5432/postgres
        run: |
          python -m pytest -q --junitxml=/tmp/pytest-standard.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/pytest-standard.xml').getroot()
          totals = {key: sum(int(s.attrib.get(key, 0)) for s in root.findall('.//testsuite'))
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          executed = totals['tests'] - totals['skipped']
          print(f"standard suite: executed={executed} passed={totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']} skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}")
          if executed < 306 or totals['skipped']:
              raise SystemExit('executed test floor violated: expected at least 306 non-skipped tests')
          PY

      - name: Run reverse-order suite
        working-directory: token-saver
        env:
          TOKEN_SAVER_PG_BASE: postgresql://postgres:ci-password@localhost:5432
          TOKEN_SAVER_PG_DSN: postgresql://postgres:ci-password@localhost:5432/postgres
        run: |
          mapfile -t tests < <(printf '%s\n' test/test_*.py | sort -r)
          python -m pytest -q --junitxml=/tmp/pytest-reverse.xml "${tests[@]}"
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/pytest-reverse.xml').getroot()
          totals = {key: sum(int(s.attrib.get(key, 0)) for s in root.findall('.//testsuite'))
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          executed = totals['tests'] - totals['skipped']
          print(f"reverse suite: executed={executed} passed={totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']} skipped={totals['skipped']} failures={totals['failures']} errors={totals['errors']}")
          if executed < 306 or totals['skipped']:
              raise SystemExit('executed test floor violated: expected at least 306 non-skipped tests')
          PY

  c5-docker-acceptance:
    name: C-5 Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run clean-clone Docker acceptance gate
        run: ./token-saver/test/c5_docker_acceptance.sh
